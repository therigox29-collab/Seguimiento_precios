name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create runnable app folder (siempre funciona)
        run: gradle createDistributable --no-daemon

      - name: Verify the app image is complete
        shell: pwsh
        run: |
          $appRoot = Get-ChildItem "build\compose\binaries\main\app" -Directory | Select-Object -First 1
          Write-Host "Carpeta de la app: $($appRoot.FullName)"

          $jvmDll = Get-ChildItem "$($appRoot.FullName)\runtime" -Recurse -Filter "jvm.dll" -ErrorAction SilentlyContinue
          if (-not $jvmDll) {
            Write-Error "jvm.dll NO está en el runtime generado. El paquete quedó incompleto."
            Get-ChildItem "$($appRoot.FullName)\runtime" -Recurse | Select-Object -First 30 | Format-Table FullName, Length
            exit 1
          }
          Write-Host "jvm.dll encontrado en: $($jvmDll.FullName)"

          $sizeMB = [math]::Round((Get-ChildItem "$($appRoot.FullName)" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Tamaño total del app image: $sizeMB MB"
          if ($sizeMB -lt 80) {
            Write-Error "El app image pesa solo $sizeMB MB, algo quedó afuera (debería pesar 100+ MB)."
            exit 1
          }

      - name: Create Windows installer .exe (puede fallar si falta WiX; no es grave)
        run: gradle packageExe --no-daemon
        continue-on-error: true

      - name: Upload app folder (portable, no necesita instalación)
        uses: actions/upload-artifact@v4
        with:
          name: MisPrecios-Windows-portable
          path: desktop/build/compose/binaries/main/app/

      - name: Upload installer .exe (si se generó)
        uses: actions/upload-artifact@v4
        with:
          name: MisPrecios-Windows-installer
          path: desktop/build/compose/binaries/main/exe/
          if-no-files-found: ignore
